experiment:
  name: aegis_joint_training_baseline
  seed: 42

training:
  max_epochs: 20
  batch_size: 16

optimizer:
  name: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001

loss:
  alignment_weight: 1.0
  classification_weight: 1.0

early_stopping:
  enabled: true
  patience: 5
  min_delta: 0.0001

checkpoint:
  directory: checkpoints
  save_best: true
  save_last: true

model:
  text_dimension: 768
  vision_dimension: 512
  shared_dimension: 512
  classifier_hidden_dimension: 256