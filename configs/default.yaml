framework:
  name: AEGIS
  version: "0.20.0"
  device: auto
  seed: 42

data:
  language: auto
  max_text_length: 512
  image_size: 224

pipeline:
  enable_context: true
  enable_intelligence: true
  enable_attribution: true
  enable_explainability: true
  enable_decision_support: true

representation:
  text:
    model_name: FacebookAI/xlm-roberta-base
    max_length: 256
    pooling: masked_mean
  vision:
    model_name: openai/clip-vit-base-patch32

alignment:
  text_dimension: 768
  vision_dimension: 512
  shared_dimension: 512
  dropout: 0.1
  temperature: 0.07
  fusion: gated

classification:
  input_dimension: 512
  hidden_dimension: 256
  dropout: 0.2

  hierarchy:
    integrity_classes: 2
    threat_classes: 4

  loss:
    integrity_weight: 1.0
    threat_weight: 1.0

context:
  domain_dimension: 32
  auxiliary_dimension: 32
  context_dimension: 128
  content_dimension: 512
  output_dimension: 512

intelligence:
  risk_weights:
    classification: 0.30
    propagation: 0.20
    synthetic_content: 0.15
    coordination: 0.15
    context: 0.20

  risk_thresholds:
    minimal: 0.20
    low: 0.40
    moderate: 0.60
    high: 0.80

attribution:
  minimum_confidence: 0.50

  enable_source_provenance: true
  enable_coordination_analysis: true
  enable_synthetic_indicators: true

  definitive_attribution: false

explainability:
  enabled: true
  include_reasoning_trace: true
  include_evidence: true
  include_uncertainty: true

  low_confidence_threshold: 0.60

  neural_feature_attribution: false

decision:
  enabled: true

  human_supervision_required: true

  autonomous_enforcement: false

  low_confidence_threshold: 0.60

  allow_monitoring_recommendation: true
  allow_verification_recommendation: true
  allow_fact_check_recommendation: true
  allow_escalation_recommendation: true

training:
  seed: 42

  batch_size: 16

  epochs: 10

  learning_rate: 0.0001

  weight_decay: 0.0001

  gradient_clip_norm: 1.0

  alignment_loss_weight: 1.0

  classification_loss_weight: 1.0

  checkpoint_directory: checkpoints

dataset:
  text_dimension: 768
  vision_dimension: 512

  batch_size: 16
  num_workers: 0

  split:
    strategy: group_aware

    train_ratio: 0.70
    validation_ratio: 0.15
    test_ratio: 0.15

    group_attribute: group_id

    seed: 42

experiment:
  name: aegis_baseline

  max_epochs: 20

  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.0001

  checkpoint:
    save_best: true
    save_last: true
    directory: checkpoints

experiment_management:
  root_directory: experiments

  save_config_snapshot: true
  save_metadata_snapshot: true

  checkpoint_format: aegis_experiment_v1

  resume_enabled: true

evaluation:
  macro_f1: true
  weighted_f1: true
  per_class_metrics: true
  confusion_matrix: true

  calibration:
    enabled: true
    bins: 10

  stratified:
    language: true
    domain: true
    source_dataset: true

  error_analysis: true