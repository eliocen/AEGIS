framework:
  name: AEGIS
  version: "0.9.0"
  device: auto
  seed: 42

data:
  language: auto
  max_text_length: 512
  image_size: 224

pipeline:
  enable_context: true
  enable_intelligence: true
  enable_attribution: true
  enable_explainability: true
  enable_decision_support: true

representation:
  text:
    model_name: FacebookAI/xlm-roberta-base
    max_length: 256
    pooling: masked_mean
  vision:
    model_name: openai/clip-vit-base-patch32

alignment:
  text_dimension: 768
  vision_dimension: 512
  shared_dimension: 512
  dropout: 0.1
  temperature: 0.07
  fusion: gated